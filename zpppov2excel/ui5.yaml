specVersion: "3.0"
metadata:
  name: zpp.processorder.v2excel.zpppov2excel
type: application
framework:
  name: SAPUI5
  version: "1.120.29"
  libraries:
    - name: sap.ui.core
    - name: sap.m
    - name: sap.ui.layout
    - name: themelib_sap_horizon
server:
  customMiddleware:
    - name: ui5-middleware-simpleproxy
      afterMiddleware: compression
      mountPath: /sap
      configuration:
        baseUri: "https://vhrgped2ci.rise.tru-advance.com:44300/sap"
        strictSSL: true
        removeETag: false
builder:
  resources:
    excludes:
      - "/test-resources/**"
      - "/resources/**/test/**"
  componentPreload:
    excludes:
      - "zpp/processorder/v2excel/zpppov2excel/thirdparty/**"
  minification:
    excludes:
      - "zpp/processorder/v2excel/zpppov2excel/thirdparty/**"
